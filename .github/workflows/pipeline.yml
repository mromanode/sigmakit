name: Sigmakit Pipeline

on: [push, pull_request, merge_group, workflow_dispatch]

permissions:
  contents: write

jobs:
  sigma-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: yaml-lint
        uses: ibiqlik/action-yamllint@v3
        with:
          strict: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pysigma sigma-cli pySigma-validators-sigmahq pysigma-backend-splunk pysigma-backend-crowdstrike pyyaml

      - name: Check Rule Status
        run: python tests/check_rule_status.py

      - name: Validate Sigma Rule Syntax
        run: sigma check --fail-on-error --fail-on-issues ./rules/sigma/

      - name: Check for duplicate IDs
        shell: /usr/bin/bash {0}  # Use bash without -e to enable exit code manipulation
        run: |
          grep -rh "^id: " ./rules/ | sort | uniq -c | grep -vE "^\s+1 id: "; exit $(( $? ^ 1 ))

      - name: Automated Conversion
        run: |
          python tests/convert_rules.py --rules rules/sigma --out ./platform-translations/splunk-spl --target splunk --pipeline ./pipelines/sigmakit_pipeline.yml --suffix .spl
          python tests/convert_rules.py --rules rules/sigma --out ./platform-translations/crowdstrike-logscale --target log_scale --pipeline crowdstrike_falcon --suffix .cql

      - name: Validate Converted Queries
        run: python tests/validate_queries.py ./platform-translations/ ./rules/sigma/

      - name: Commit Generated Queries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./platform-translations/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: tailor Splunk and CrowdStrike queries from Sigma rules"
          git push